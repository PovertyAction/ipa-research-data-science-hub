[project]
name = "ipa-research-data-science-hub"
version = "0.1.0"
description = "IPA Research & Data Science Hub"
readme = "README.md"
requires-python = ">= 3.11"

dependencies = [
    "altair>=5.5.0",
    "causaldata>=0.1.5",
    "duckdb>=1.5.1,<2.0",
    "filelock>=3.20.3",
    "fonttools>=4.60.2",
    "great-tables>=0.15.0",
    "h11>=0.16.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.8",
    "nbconvert>=7.17.0",
    "nbstata>=0.8.6,<1.0",
    "pandas>=2.2.3,<3.0",
    "pillow>=12.1.1",
    "polars>=1.17.1",
    "radian>=0.6.15",
    "seaborn>=0.13.2",
    "setuptools>=78.1.1",
    "stata-setup>=0.1.3",
    "tornado>=6.5",
    "urllib3>=2.6.0",
]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff>=0.15.10,<0.16"]

[tool.jupysql.SqlMagic]
feedback = 0
autopandas = false
autopolars = false
autolimit = 0
displaylimit = 10

[tool.ruff]
line-length = 88
fix = true
# Assume Python 3.11
target-version = "py311"
exclude = [".claude/skills/", ".claude/subagents/"]


[tool.ruff.lint]
# docs: https://docs.astral.sh/ruff/rules/
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "D",   # flake8-docstrings
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

ignore = [
    # do not enable if formatting
    # docs: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab indentation
    "E111",   # indentation
    "E114",   # indentation
    "E117",   # over indented
    "D206",   # indent with spaces
    "D300",   # triple single quotes
    "E501",   # line length regulated by formatter
    "D105",   # missing docstring in magic method
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "SIM110", # Use all instead of `for` loop
    "TRY003", # Avoid specifying long messages outside the exception class
    "D205",   # 1 blank line required between summary line and description
    "D203",
    "D213",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
ignore-words-list = "adn,master,uint,wrod,sme,hist,claus,humber,thead,ro"
skip = "./.*,codespell_lib/data/*,codespell_lib/tests/*"
