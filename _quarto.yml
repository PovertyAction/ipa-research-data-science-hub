project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*.md"
    - "!page-template.qmd"
    - "!CONTRIBUTING.md"
    - "!LICENSE.md"
    - "!CLAUDE.md"
    - "!AGENTS.md"
    - "!docs/"
    - "!extensions/"
website:
  title: "Research and Data Science Hub"
  favicon: "assets/logos/ipa-favicon.ico"
  cookie-consent:
    type: implied
    style: simple
  google-analytics:
