brand:
  light: assets/design-styles/light-brand.yml
  dark: assets/design-styles/dark-brand.yml
highlight-style:
  light: arrow
  dark: dracula
filters:
  - git-dates
format:
  html:
    respect-user-color-scheme: true
    toc: true
    appendix-style: none # removes "Reuse" appendix section
    theme:
      light: [litera, brand, assets/design-styles/light-theme.scss]
      dark: [litera, brand, assets/design-styles/dark-theme.scss]
    code-copy: true
    code-overflow: wrap
    css:
      - ./assets/design-styles/styles.css
    toc-title: "In this resource"
    template-partials:
      - ./assets/design-styles/toc.html
      - ./assets/design-styles/title-block.html
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px
#   ipa-handout-typst:

#     theme: brand
#     papersize: a4
#     toc: false
#     columns: 1
#     number-sections: false
format-links:
  - format: typst
    text: PDF
    icon: file-pdf
language:
  search-text-placeholder: Search Resources
metadata-files:
  - _metadata.yml
execute:
  freeze: true
