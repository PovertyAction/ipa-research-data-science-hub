<!-- First focusable element on every page: lets keyboard users jump past the
     navbar and sidebar. Target is Quarto's <main>, or the role="main" div on
     the custom-layout homepage. -->
<a class="skip-link visually-hidden-focusable" href="#quarto-document-content">Skip to main content</a>
<script>
  // Quarto places include-before-body inside <main>; move the link to the
  // start of <body> so it comes before the navbar in tab order
  document.body.prepend(document.currentScript.previousElementSibling);
</script>
<script>
  // Listing pages: Quarto renders the category filter title as an <h5> in
  // the margin, ahead of the page's <h1>. Keep its look, drop it from the
  // heading outline so the page title leads.
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("h5.quarto-listing-category-title").forEach(function (h) {
      h.setAttribute("role", "presentation");
    });
  });
</script>
<script>
  // Screen recordings (web-media filter) play like GIFs, but only while near
  // the viewport, so a page with several downloads each one as the reader
  // reaches it. Readers who ask for reduced motion (and browsers without
  // IntersectionObserver) get still videos; controls still play them.
  document.addEventListener("DOMContentLoaded", function () {
    var videos = document.querySelectorAll("video[data-autoplay]");
    if (!videos.length || !("IntersectionObserver" in window) ||
        window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      return;
    }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.play().catch(function () {});
        } else {
          entry.target.pause();
        }
      });
    }, { rootMargin: "200px 0px" });
    videos.forEach(function (video) { observer.observe(video); });
  });
</script>
<script>
  // Cookie notice and Google Analytics. Replaces Quarto's cookie-consent and
  // google-analytics options (removed from _quarto.yml). Same consent model as
  // before: analytics load unless the visitor declines. The choice is kept in
  // localStorage; "Cookie preferences" in the footer reopens the notice.
  (function () {
    var GA_ID = "G-5YYP29ZV82";
    var KEY = "ipa-hub-cookie-consent"; // "accepted" | "declined"

    function stored() {
      try {
        var value = localStorage.getItem(KEY);
        if (value) return value;
      } catch (e) {}
      // Visitors who answered Quarto's old banner keep their choice
      var old = document.cookie.match(/(?:^|; )cookie_consent_level=([^;]*)/);
      if (old) {
        try {
          var levels = JSON.parse(decodeURIComponent(old[1]));
          if (levels.tracking === false) return "declined";
          if (/(?:^|; )cookie_consent_user_accepted=true/.test(document.cookie)) return "accepted";
        } catch (e) {}
      }
      return null;
    }

    function save(value) {
      try { localStorage.setItem(KEY, value); } catch (e) {}
    }

    function loadAnalytics() {
      window["ga-disable-" + GA_ID] = false;
      if (window.gtag) return;
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date());
      window.gtag("config", GA_ID, { anonymize_ip: true });
      var script = document.createElement("script");
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
      document.head.appendChild(script);
    }

    function stopAnalytics() {
      window["ga-disable-" + GA_ID] = true;
      // GA sets _ga cookies on the top-level domain; expire them on every
      // parent domain of this host
      var names = document.cookie.split("; ").map(function (c) { return c.split("=")[0]; })
        .filter(function (n) { return n === "_ga" || n.indexOf("_ga_") === 0 || n === "_gid"; });
      var parts = location.hostname.split(".");
      names.forEach(function (name) {
        document.cookie = name + "=; max-age=0; path=/";
        for (var i = 0; i < parts.length - 1; i++) {
          document.cookie = name + "=; max-age=0; path=/; domain=." + parts.slice(i).join(".");
        }
      });
    }

    function closeNotice() {
      var notice = document.querySelector(".cookie-notice");
      if (notice) notice.remove();
    }

    function showNotice() {
      if (document.querySelector(".cookie-notice")) return;
      var notice = document.createElement("div");
      notice.className = "cookie-notice";
      notice.setAttribute("role", "region");
      notice.setAttribute("aria-label", "Cookie notice");
      notice.innerHTML =
        '<p class="cookie-notice-text">We use cookies to analyze site traffic and improve the Hub.</p>' +
        '<div class="cookie-notice-actions">' +
        '<button type="button" class="cookie-notice-accept">OK</button>' +
        '<button type="button" class="cookie-notice-decline">Decline</button>' +
        "</div>";
      notice.querySelector(".cookie-notice-accept").addEventListener("click", function () {
        save("accepted");
        loadAnalytics();
        closeNotice();
      });
      notice.querySelector(".cookie-notice-decline").addEventListener("click", function () {
        save("declined");
        stopAnalytics();
        closeNotice();
      });
      document.body.appendChild(notice);
    }

    var choice = stored();
    if (choice !== "declined") loadAnalytics();

    document.addEventListener("DOMContentLoaded", function () {
      if (!choice) showNotice();
      var footer = document.querySelector(".nav-footer-center");
      if (footer) {
        var wrap = document.createElement("div");
        wrap.className = "cookie-preferences-footer";
        wrap.innerHTML = '<button type="button">Cookie preferences</button>';
        wrap.querySelector("button").addEventListener("click", showNotice);
        footer.appendChild(wrap);
      }
    });
  })();
</script>
