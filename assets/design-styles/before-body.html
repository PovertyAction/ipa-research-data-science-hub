<!-- First focusable element on every page: lets keyboard users jump past the
     navbar and sidebar. Target is Quarto's <main>, or the role="main" div on
     the custom-layout homepage. -->
<a class="skip-link visually-hidden-focusable" href="#quarto-document-content">Skip to main content</a>
<script>
  // Quarto places include-before-body inside <main>; move the link to the
  // start of <body> so it comes before the navbar in tab order
  document.body.prepend(document.currentScript.previousElementSibling);
</script>
<script>
  // Screen recordings autoplay like GIFs (web-media filter). Readers who ask
  // their system for reduced motion get them paused; controls still play them.
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("video[autoplay]").forEach(function (video) {
        video.removeAttribute("autoplay");
        video.pause();
      });
    });
  }
</script>
<script>
  // Quarto's cookie-consent library hard-codes its banner text, which says the
  // site shows "personalized content and targeted ads". The Hub does neither
  // (it only runs Google Analytics), so drop that clause. Quarto registers the
  // banner in <head>, so its DOMContentLoaded handler has run before this one.
  document.addEventListener("DOMContentLoaded", function () {
    var text = document.querySelector(".termsfeed-com---nb .cc-nb-text");
    if (text) {
      text.textContent =
        "We use cookies and other tracking technologies to improve your " +
        "browsing experience on our website, to analyze our website traffic, " +
        "and to understand where our visitors are coming from.";
    }
  });
</script>
