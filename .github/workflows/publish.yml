on:
  workflow_dispatch:
  push:
    branches:
      - main
name: Publish Quarto Site
#docs: https://quarto.org/docs/publishing/github-pages.html#publish-action

permissions:
  contents: read
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        # persist-credentials must stay true: quarto's gh-pages publish pushes

        # via a git worktree that inherits this checkout's credential config.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync uv
        run: uv sync --locked --all-extras --dev
      - name: Install R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.4.3'
      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: 1
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          tinytex: false
      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_PYTHON: ".venv/bin/python3"
