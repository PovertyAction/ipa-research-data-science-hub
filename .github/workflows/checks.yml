name: formatting-and-writing-style
on:
  pull_request:
    branches:
      - main
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1
  vale:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: errata-ai/vale-action@v2.1.1
        with:
          reporter: github-pr-check # Alternatives: github-pr-check, github-pr-review, github-check
          fail_on_error: false
          filter_mode: diff_context # Alternatives: added, diff_context, file, nofilter
          vale_flags: "--minAlertLevel=error"
          files: '["data-cleaning/", "data-collection", "data-quality/", "data-secturity", "research-design", "research-ethics/", "software/", "index.qmd"]'
