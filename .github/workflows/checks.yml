name: formatting-and-writing-style
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  vale:
    needs: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # 3.0.0
        with:
          reporter: github-pr-check # Alternatives: github-pr-check, github-pr-review, github-check
          fail_on_error: false
          filter_mode: diff_context # Alternatives: added, diff_context, file, nofilter
          vale_flags: "--minAlertLevel=error"
          files: '["data-cleaning/", "data-collection/", "data-quality/", "data-security/", "research-design/", "research-ethics/", "software/", "index.qmd"]'
